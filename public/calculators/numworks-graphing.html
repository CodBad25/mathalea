.calculator-container {
  position: relative;
  display: inline-block;
}

.calculator-container img {
  
  
  display: block;
}

.calculator span {
  position: absolute;
  display: block;
  border-radius: 999px;
  cursor: pointer;
}

.calculator span:hover {
  background-color: rgba(0, 0, 0, 0.1);
}

.calculator span:active {
  background-color: rgba(0, 0, 0, 0.2);
}

.calculator.loading canvas {
  display: none;
}

.calculator .loader {
  display: none;
}

.calculator.loading .loader {
  display: flex;
  align-items: center;
  justify-content: center;
}

.calculator svg {
  width: 33%;
}

@keyframes calculator-loader-rotation {
  from { stroke-dashoffset: 0; }
  to { stroke-dashoffset: -290; }
}

.calculator svg circle {
  animation: calculator-loader-rotation 1.2s linear infinite;
}



body {
  background: #C2C2C2;
  margin: 0;
  padding: 0;
  text-align: center;
}

.col-fullscreen {
  display: none;
  width: 60%;
  float: left;
  height: 100vh;
}

.col-fullscreen canvas {
  margin-top: 2vh;
}

.col-fullscreen canvas {
  max-height: 96vh;
  max-width: 64vw;

  height: 48vw; 

  width: auto;
}

body.fullscreen .col-fullscreen {
  display: flex;
}

body.fullscreen .col-calculator {
  width: 35%;
  float: left;
}

/* Recadrage : l'image WebP inclut une marge transparente (ombre portée) autour
   de la calculatrice ; .col-calculator sert de fenêtre de recadrage (masque) et
   .calculator-container est agrandi + décalé pour n'afficher que la zone opaque,
   sans que cela ne désaligne les zones cliquables (positionnées en % de ce même
   conteneur, dont les proportions internes restent celles de l'image complète). */
.col-calculator {
  position: relative;
  overflow: hidden;
  width: 100%;
  height: 100vh;
}

.calculator-container {
  position: absolute;
  left: -7.48%;
  top: -0.55%;
  width: 115.07%;
  height: 110.38%;
  margin-top: 0;
}

.calculator-container img {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
}

.actions {
  position: relative;
  margin-left: 20px; 
}

a.action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
  height: 2vh;
  aspect-ratio: 1.2;
  padding: 1vh 2vh;
  border: 1px solid black;
  border-radius: 100px;
  cursor: pointer;
  opacity: 0.65;
}

a.action:hover {
  opacity: 1.0;
  background-color: rgba(0,0,0,0.125);
}

a.action svg {
  display: block;
  height: 100%;
}

a.action svg.action-fullscreen-exit,
body.fullscreen a.action svg.action-fullscreen-expand {
  display: none;
}

body.fullscreen a.action svg.action-fullscreen-exit {
  display: block;
}



canvas.calculator-mirror {
  image-rendering: -moz-crisp-edges;
  image-rendering: pixelated;
  -ms-interpolation-mode: nearest-neighbor;
}


.actions { display: none !important; }

    <script>

function Calculator(emModule) {
  
     

  // Configure emModule
  var emModule = typeof emModule === 'undefined' ? {} : emModule;
  var calculatorElement = emModule.element || document.querySelector('.calculator');
  var mainCanvas = calculatorElement.querySelector('canvas');
  if (typeof emModule.mirrorCanvas === 'undefined') {
    
    emModule.mirrorCanvas = document.querySelector('canvas.calculator-mirror');
  }
  var mirrorCanvasContext = emModule.mirrorCanvas ? emModule.mirrorCanvas.getContext('2d') : null;
  var args = [
    '--language',
    document.documentElement.lang || window.navigator.language.split('-')[0],
  ];

  // An external app can be loaded with epsilon.html?nwb=example.wasm&nwbdata=data.bin
  const params = new URLSearchParams(window.location.search);
  nwbPath = params.get('nwb');
  if (nwbPath) {
    args.push('--nwb', nwbPath);
    nwbDataPath = params.get('nwbdata');
    if (nwbDataPath) {
      fetch(nwbDataPath)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`Cannot download external data file ${nwbDataPath}`);
          }
          return response.arrayBuffer();
        })
        .then((buffer) => {
          emModule.FS.writeFile('/data', new Uint8Array(buffer));
        });
      args.push('--nwb-external-data', '/data');
    }
  }

  var defaultModule = {
    canvas: mainCanvas,
    arguments: args,
    onEpsilonIdle: function () {
      calculatorElement.classList.remove('loading');
    },
    takeScreenshot: function (e) {
      if (e.altKey) {
        this.copyScreenshot();
      } else {
        this.downloadScreenshot();
      }
    },
    copyScreenshot: function () {
      this.screenshot(function (blob) {
        let data = [new ClipboardItem({ [blob.type]: blob })];
        navigator.clipboard.write(data);
      });
    },
    downloadScreenshot: function () {
      this.screenshot(function (blob) {
        var url = URL.createObjectURL(blob);
        console.log(blob, url);
        var link = document.createElement('a');
        link.download = 'screenshot.png';
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
      });
    },
    screenshot: function (callback) {
      if (typeof this._IonDisplayForceRefresh === 'function') {
        // Some versions of Epsilon (before 20.1.1) need this call
        this._IonDisplayForceRefresh();
      }
      return mainCanvas.toBlob(callback);
    },
  };
  if (mirrorCanvasContext) {
    defaultModule.onDisplayRefresh = function () {
      mirrorCanvasContext.drawImage(mainCanvas, 0, 0);
    };
  }
  for (var attrname in defaultModule) {
    if (!emModule.hasOwnProperty(attrname)) {
      emModule[attrname] = defaultModule[attrname];
    }
  }

  // Load and run Epsilon
  Epsilon(emModule).then((resultModule) => {
    
         
    emModule = Object.assign(emModule, resultModule);
    emModule.loaded = true;

    
                                                  
    function eventHandler(keyHandler) {
      return function (ev) {
        var key = this.getAttribute('data-key');
        keyHandler(key);
        
                                                                   
        ev.preventDefault();
      };
    }
    var downHandler = eventHandler(emModule._IonSimulatorKeyboardKeyDown);
    var upHandler = eventHandler(emModule._IonSimulatorKeyboardKeyUp);

    calculatorElement.querySelectorAll('span').forEach(function (span) {
      
      span.addEventListener('pointerdown', downHandler);
      span.addEventListener('pointerup', upHandler);
    });

    
                                                      
    var physicalKeyToIndex = {
      ArrowLeft: 0,
      ArrowUp: 1,
      ArrowDown: 2,
      ArrowRight: 3,
    };
    function physicalKeyHandler(keyHandler) {
      return function (ev) {
        var index = physicalKeyToIndex[ev.code];
        if (typeof index === 'undefined') {
          return;
        }
        keyHandler(index);
        // Prevent default action of event.
        ev.preventDefault();
        // Prevent the native SDL path from also handling the event.
        ev.stopImmediatePropagation();
      };
    }
    window.addEventListener(
      'keydown',
      physicalKeyHandler(emModule._IonSimulatorKeyboardKeyDown),
      true,
    );
    window.addEventListener('keyup', physicalKeyHandler(emModule._IonSimulatorKeyboardKeyUp), true);

    
                                          
    if (typeof emModule.onLoaded === 'function') {
      emModule.onLoaded();
    }
  });

  function resizeImgForJpg(img) {
    if (img.currentSrc.endsWith('.jpg') || img.currentSrc.startsWith('data:image/jpg')) {
      calculatorElement.style.top = '0';
      calculatorElement.style.left = '0';
      calculatorElement.style.width = '100%';
      calculatorElement.style.height = '100%';
    }
  }

  var calculatorImg = document.querySelector('picture > img');
  // On Chrome, the img may take time to load the currentSrc, so we need to add
  // a callback.
  if (calculatorImg.complete) {
    resizeImgForJpg(calculatorImg);

document.getElementById("action-fullscreen").addEventListener("click", function(e){

function flashActionDone(anchor) {
  var done = anchor.querySelector(".action-done");
  var icons = anchor.querySelectorAll("svg:not(.action-done)");
  icons.forEach(function (svg) { svg.style.display = "none"; });
  done.style.display = "block";
  setTimeout(function () {
    icons.forEach(function (svg) { svg.style.display = ""; });
    done.style.display = "none";
  }, 600);
}

document.getElementById("action-screenshot").addEventListener("click", function(e) {
  ModuleAsync.takeScreenshot(e);
  if (e.altKey) {
    
    flashActionDone(this);
  }
});

document.getElementById("action-share").addEventListener("click", function(e) {
  
                                                                             
  var binary = "";
  var events = ModuleAsync.recordedEvents;
  for (var i = 0; i < events.length; i++) {
    binary += String.fromCharCode(events[i]);
  }
  var nws = btoa(binary).replace(/\+/g, "-").replace(/[/]/g, "_");
  var url = new URL(window.location.href);
  url.searchParams.set("nws", nws);
  var anchor = this;
  navigator.clipboard.writeText(url.toString()).then(function () {
    flashActionDone(anchor);
  });
});


                      
if (window.location.protocol === "file:") {
  document.getElementById("action-share").style.display = "none";
