storeDir: .pnpm-store

onlyBuiltDependencies:
  - '@parcel/watcher'
  - apigeom@1.6.2
  - esbuild
  - svelte-preprocess
  - unrs-resolver
allowBuilds:
  '@parcel/watcher': true
  apigeom: true
  apigeom@git+https://forge.apps.education.fr/coopmaths/apigeom.git: true
  core-js: false
  esbuild: true
blockExoticSubdeps: false
overrides:
  typed-function@<0.10.6: '>=4.0.0'
  moment@>=2.18.0 <2.29.4: '>=2.29.4'
  svelte@<3.49.0: '>=3.49.0'
  react: ^18.3.1
  react-dom: ^18.3.1
  # scratchFr.json (dans @scratch2latex/scratch-core) référence encore des
  # IDs de blocs renommés dans scratchblocks 3.7.1 (ex: SENSING_OF_DIRECTION
  # -> MOTION_DIRECTION), ce qui casse le rendu de TOUS les exercices (pas
  # seulement Scratch, car renderScratchDiv est appelé sans condition).
  # À retirer quand scratch-core aura été mis à jour en amont.
  scratchblocks: 3.6.4
